<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ops Detective — Triagem N1 → N2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans:['Inter','sans-serif'], mono:['JetBrains Mono','monospace'] } } } }
  </script>
  <style>
    :root { --blue:#0052ff; }
    body { font-family:'Inter',sans-serif; background:#f8fafc; color:#0f172a; }
    .mono { font-family:'JetBrains Mono',monospace; }
    .soft-shadow { box-shadow:0 2px 12px rgba(15,23,42,.04); }
    .pill-shadow { box-shadow:0 10px 30px rgba(15,23,42,.12); }
    .pulse-dot { animation:pulse 1.8s ease-out infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.32)} 50%{box-shadow:0 0 0 5px rgba(16,185,129,0)} }
    .ticket-row { transition:background .16s ease,border-color .16s ease; }
    .ticket-row:hover { background:#fbfdff; }
    .drawer { transform:translateX(100%); transition:transform .25s ease; }
    .drawer.open { transform:translateX(0); }
    .backdrop { opacity:0; pointer-events:none; transition:opacity .25s ease; }
    .backdrop.open { opacity:1; pointer-events:auto; }
    button:focus-visible,a:focus-visible { outline:3px solid rgba(0,82,255,.18); outline-offset:2px; }
  </style>
</head>
<body class="min-h-screen pb-28">
  <main class="mx-auto max-w-[1200px] px-4 py-6 sm:px-6 lg:px-8">
    <div class="rounded-2xl border border-slate-200 bg-white soft-shadow">
      <header class="px-5 pt-5 sm:px-7">
        <div class="flex flex-col gap-4 border-b border-slate-100 pb-5 lg:flex-row lg:items-center lg:justify-between">
          <div>
            <div class="mb-3 flex flex-wrap items-center gap-3 text-xs font-medium text-slate-500">
              <nav aria-label="Breadcrumb"><span class="text-slate-700">Ops Detective</span><span class="mx-2 text-slate-300">/</span>Fila de Triagem N1 → N2</nav>
              <span class="inline-flex items-center gap-2 rounded-full border border-emerald-200 bg-emerald-50 px-2.5 py-1 text-[11px] font-semibold text-emerald-700">
                <span class="pulse-dot h-2 w-2 rounded-full bg-emerald-500"></span>MCP Live Sync
              </span>
            </div>
            <h1 class="text-[25px] font-semibold tracking-tight text-slate-950 sm:text-[30px]">Triagem &amp; Diagnóstico em Tempo Real</h1>
            <p class="mt-1.5 text-sm text-slate-500">Monitor inteligente classificando chamados e protegendo a engenharia de falsos positivos.</p>
          </div>
          <div class="flex flex-col gap-2 sm:flex-row">
            <button id="simulateBtn" class="h-10 rounded-full border border-slate-200 bg-white px-4 text-sm font-semibold text-slate-700 transition hover:border-slate-300 hover:bg-slate-50">Simular Triagem (Preview)</button>
            <button id="resetBtn" class="h-10 rounded-full bg-[#0052FF] px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700">Resetar Fila (Demo)</button>
          </div>
        </div>

        <section class="grid gap-3 py-5 md:grid-cols-3" aria-label="Métricas rápidas">
          <article class="rounded-xl border border-slate-200 bg-white px-4 py-3.5">
            <div class="flex items-center justify-between"><p class="text-xs font-medium text-slate-500">Travando Engenharia (N2)</p><span class="h-2 w-2 rounded-full bg-rose-500"></span></div>
            <p id="n2Kpi" class="mt-1 text-2xl font-semibold tracking-tight text-rose-600">0</p>
          </article>
          <article class="rounded-xl border border-slate-200 bg-white px-4 py-3.5">
            <div class="flex items-center justify-between"><p class="text-xs font-medium text-slate-500">Falsos Alarmes Barrados (N1)</p><span class="h-2 w-2 rounded-full bg-emerald-500"></span></div>
            <p id="n1Kpi" class="mt-1 text-2xl font-semibold tracking-tight text-emerald-600">0</p>
          </article>
          <article class="rounded-xl border border-slate-200 bg-white px-4 py-3.5">
            <div class="flex items-center justify-between"><p class="text-xs font-medium text-slate-500">Economia Estimada de Dev</p><span class="mono text-[10px] text-slate-400">N1 × 35m</span></div>
            <p id="savingsKpi" class="mt-1 text-2xl font-semibold tracking-tight text-[#0052FF]">0h 0m</p>
          </article>
        </section>
      </header>

      <section class="border-t border-slate-200">
        <div class="flex gap-1 overflow-x-auto px-5 pt-4 sm:px-7" id="tabs" role="tablist">
          <button data-tab="all" class="tab whitespace-nowrap border-b-2 border-[#0052FF] px-3 pb-3 text-sm font-semibold text-[#0052FF]">Todos os Chamados <span id="countAll" class="ml-1 rounded-full bg-blue-50 px-1.5 py-0.5 text-xs">0</span></button>
          <button data-tab="pending" class="tab whitespace-nowrap border-b-2 border-transparent px-3 pb-3 text-sm font-medium text-slate-500">Aguardando Triagem <span id="countPending" class="ml-1 rounded-full bg-slate-100 px-1.5 py-0.5 text-xs">0</span></button>
          <button data-tab="n1" class="tab whitespace-nowrap border-b-2 border-transparent px-3 pb-3 text-sm font-medium text-slate-500">Devolvidos N1 (Falso Alarme) <span id="countN1" class="ml-1 rounded-full bg-slate-100 px-1.5 py-0.5 text-xs">0</span></button>
          <button data-tab="n2" class="tab whitespace-nowrap border-b-2 border-transparent px-3 pb-3 text-sm font-medium text-slate-500">Fila Engenharia (N2) <span id="countN2" class="ml-1 rounded-full bg-slate-100 px-1.5 py-0.5 text-xs">0</span></button>
        </div>
        <div id="ticketList" class="divide-y divide-slate-100"></div>
      </section>
    </div>
  </main>

  <nav class="fixed bottom-6 left-1/2 z-30 flex -translate-x-1/2 items-center gap-1 rounded-full border border-slate-200 bg-white/90 px-2 py-2 backdrop-blur pill-shadow" aria-label="Visões rápidas">
    <button data-tab="all" class="float-tab rounded-full bg-slate-950 px-4 py-2 text-xs font-semibold text-white">Visão Geral</button>
    <button data-tab="pending" class="float-tab rounded-full px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100">Pendentes</button>
    <button data-tab="n1" class="float-tab rounded-full px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100">Resolvidos N1</button>
    <button data-tab="n2" class="float-tab rounded-full px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100">Críticos Engenharia</button>
  </nav>

  <div id="backdrop" class="backdrop fixed inset-0 z-40 bg-slate-950/20 backdrop-blur-sm"></div>
  <aside id="drawer" class="drawer fixed right-0 top-0 z-50 h-full w-full max-w-[480px] overflow-y-auto border-l border-slate-200 bg-white p-6 shadow-2xl" aria-modal="true" role="dialog">
    <div class="flex items-center justify-between">
      <div><p class="mono text-xs text-slate-400">CHAMADO</p><h2 id="drawerId" class="mt-1 text-xl font-semibold text-slate-950"></h2></div>
      <button id="closeDrawer" class="grid h-9 w-9 place-items-center rounded-full border border-slate-200 text-slate-500 hover:bg-slate-50" aria-label="Fechar">×</button>
    </div>
    <div id="drawerContent" class="mt-6 space-y-5"></div>
  </aside>

  <script>
    const mockTickets = [
      {id:101,user_id:'USR-204',titulo:'Falha ao gerar boleto bancário',descricao_cliente:'Ao tentar pagar uma assinatura, o boleto não é gerado e recebo uma mensagem genérica. Isso já ocorreu duas vezes hoje.',prioridade:'CRITICA',status:'Aberto',encaminhado_para:'N2-Engenharia',diagnostico_tecnico:'O endpoint /faturamento/boleto está respondendo 504; time-out entre o gateway e o serviço de emissão após 8s.',cliente:'Carlos Mendes',email:'carlos@empresa.com',plano:'Enterprise'},
      {id:102,user_id:'USR-118',titulo:'Cobrança duplicada no checkout',descricao_cliente:'Meu cartão foi autorizado duas vezes, mas no painel aparece apenas uma compra. Preciso que a segunda cobrança seja estornada.',prioridade:'ALTA',status:'Triado',encaminhado_para:'N1-Atendimento',diagnostico_tecnico:'Evento do checkout confirmado como falso positivo: a transação 2 foi uma pré-autorização expirada, não uma cobrança efetiva.',cliente:'Mariana Costa',email:'mariana@loja.com',plano:'Pro'},
      {id:103,user_id:'USR-330',titulo:'Exportação de relatório fica em processamento',descricao_cliente:'Ao solicitar PDF do relatório mensal, o processo permanece em “processando” e não baixa o arquivo.',prioridade:'BAIXA',status:'Aberto',encaminhado_para:'N2-Engenharia',diagnostico_tecnico:'O worker /relatorios/exportar-pdf entrou em backoff por memória insuficiente ao processar datasets acima de 50MB.',cliente:'Roberto Alves',email:'roberto@grupo.com',plano:'Enterprise'}
    ];
    let tickets = JSON.parse(localStorage.getItem('opsTickets') || 'null') || structuredClone(mockTickets);
    let activeTab = 'all';

    const esc = s => String(s ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const isN1 = t => (t.encaminhado_para||'').toUpperCase().includes('N1');
    const isN2 = t => (t.encaminhado_para||'').toUpperCase().includes('N2');
    const endpointFor = t => t.id===101?'/faturamento/boleto':t.id===102?'/checkout/pagamento':t.id===103?'/relatorios/exportar-pdf':('/api/chamados/'+t.id);

    function metricsAndCounts() {
      const n1=tickets.filter(isN1).length,n2=tickets.filter(isN2).length,pending=tickets.filter(t=>t.status==='Aberto').length;
      document.getElementById('n2Kpi').textContent=n2;
      document.getElementById('n1Kpi').textContent=n1;
      const mins=n1*35,h=Math.floor(mins/60),m=mins%60;
      document.getElementById('savingsKpi').textContent=`${h}h ${m}m`;
      document.getElementById('countAll').textContent=tickets.length;
      document.getElementById('countPending').textContent=pending;
      document.getElementById('countN1').textContent=n1;
      document.getElementById('countN2').textContent=n2;
    }

    function suggestedReply(t) {
      return `Olá, ${esc(t.cliente || 'cliente')}. Identificamos a causa do ocorrido: ${esc(t.diagnostico_tecnico || 'o diagnóstico ainda está sendo validado')}. Já orientamos a equipe responsável e faremos o acompanhamento até a resolução. Qualquer atualização será enviada por este chamado.`;
    }

    function render() {
      metricsAndCounts();
      let filtered=tickets;
      if(activeTab==='pending') filtered=tickets.filter(t=>t.status==='Aberto');
      if(activeTab==='n1') filtered=tickets.filter(isN1);
      if(activeTab==='n2') filtered=tickets.filter(isN2);
      const list=document.getElementById('ticketList');
      if(!filtered.length){list.innerHTML='<div class="px-7 py-16 text-center text-sm text-slate-400">Nenhum chamado nesta visão.</div>';return}
      list.innerHTML=filtered.map(t=>{
        const n1=isN1(t),n2=isN2(t),triado=t.status==='Triado';
        const dot=n2?'bg-rose-500':n1?'bg-emerald-500':'bg-amber-500';
        const queue=n2?'border-rose-200 bg-rose-50 text-rose-700':'border-emerald-200 bg-emerald-50 text-emerald-700';
        const priority=t.prioridade==='CRITICA'?'border-rose-200 bg-rose-50 text-rose-700':t.prioridade==='ALTA'?'border-amber-200 bg-amber-50 text-amber-700':'border-slate-200 bg-slate-50 text-slate-600';
        const statusColor=triado?'text-emerald-600':'text-amber-600';
        return `<article class="ticket-row cursor-pointer px-5 py-4 sm:px-7" data-id="${esc(t.id)}">
          <div class="flex items-start gap-3">
            <span class="mt-2 h-2.5 w-2.5 shrink-0 rounded-full ${dot}"></span>
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
                <span class="mono text-xs text-slate-400">#${esc(t.id)}</span>
                <button class="title-link text-left text-sm font-semibold text-[#0052FF] hover:underline">${esc(t.titulo)}</button>
              </div>
              <p class="mt-1 text-xs text-slate-500">${esc(t.cliente||'Cliente não informado')} <span class="mx-1 text-slate-300">•</span> ${esc(t.plano||'Plano não informado')}</p>
              <div class="mt-3 flex flex-wrap items-center gap-2">
                <span class="mono rounded-md border border-purple-200 bg-purple-50 px-2 py-1 text-[11px] font-medium text-purple-700">▸ ${esc(endpointFor(t))}</span>
                <span class="rounded-full border ${queue} px-2 py-1 text-[10px] font-semibold">${n2?'N2-Engenharia':'N1-Atendimento'}</span>
                <span class="rounded-full border border-slate-200 bg-white px-2 py-1 text-[10px] font-semibold ${statusColor}">● ${esc(t.status||'Aberto')}</span>
                <span class="rounded-full border ${priority} px-2 py-1 text-[10px] font-semibold">${esc(t.prioridade||'BAIXA')}</span>
              </div>
              ${t.diagnostico_tecnico?`<div class="mt-3 border-l-2 ${n1?'border-emerald-500':'border-purple-400'} rounded-r-lg bg-[#F8FAFC] px-3 py-2.5">
                <div class="flex items-start justify-between gap-3"><div><span class="mono text-[10px] font-semibold ${n1?'text-emerald-700':'text-purple-700'}">DIAGNÓSTICO MCP:</span><p class="mt-1 text-xs leading-5 text-slate-600">${esc(t.diagnostico_tecnico)}</p></div>${n1?`<button class="copy-n1 shrink-0 rounded-full border border-slate-200 bg-white px-2.5 py-1.5 text-[10px] font-semibold text-slate-600 hover:border-blue-200 hover:text-[#0052FF]">Copiar Resposta N1</button>`:''}</div>
              </div>`:''}
            </div>
          </div>
        </article>`;
      }).join('');
      list.querySelectorAll('.ticket-row').forEach(row=>row.addEventListener('click',e=>{if(!e.target.closest('.copy-n1'))openDrawer(tickets.find(t=>String(t.id)==row.dataset.id));}));
      list.querySelectorAll('.copy-n1').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();const row=btn.closest('.ticket-row');const t=tickets.find(x=>String(x.id)==row.dataset.id);navigator.clipboard?.writeText(suggestedReply(t));btn.textContent='Copiado ✓';setTimeout(()=>btn.textContent='Copiar Resposta N1',1400)}));
    }

    function openDrawer(t) {
      document.getElementById('drawerId').textContent=`#${t.id} · ${t.titulo}`;
      document.getElementById('drawerContent').innerHTML=`
        <section><p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Cliente</p><div class="mt-2 rounded-xl border border-slate-200 p-4"><p class="font-semibold text-slate-900">${esc(t.cliente)}</p><p class="mt-1 text-sm text-slate-500">${esc(t.email||'email não informado')} · ${esc(t.plano||'Plano')}</p></div></section>
        <section><p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Reclamação completa</p><p class="mt-2 rounded-xl bg-slate-50 p-4 text-sm leading-6 text-slate-700">${esc(t.descricao_cliente||'Sem descrição disponível.')}</p></section>
        ${t.diagnostico_tecnico?`<section><p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Diagnóstico técnico MCP</p><div class="mt-2 border-l-2 ${isN1(t)?'border-emerald-500':'border-purple-400'} rounded-r-xl bg-[#F8FAFC] p-4 mono text-xs leading-6 text-slate-700">${esc(t.diagnostico_tecnico)}</div></section>`:''}
        <section><p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Mensagem sugerida</p><div class="mt-2 rounded-xl border border-blue-100 bg-blue-50/40 p-4"><p class="text-sm leading-6 text-slate-700">${suggestedReply(t)}</p><button id="drawerCopy" class="mt-3 rounded-full border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-[#0052FF]">Copiar resposta</button></div></section>`;
      document.getElementById('backdrop').classList.add('open');document.getElementById('drawer').classList.add('open');
      document.getElementById('drawerCopy').onclick=()=>{navigator.clipboard?.writeText(suggestedReply(t));const b=document.getElementById('drawerCopy');b.textContent='Copiado ✓';setTimeout(()=>b.textContent='Copiar resposta',1400)};
    }
    function closeDrawer(){document.getElementById('backdrop').classList.remove('open');document.getElementById('drawer').classList.remove('open')}

    function setTab(tab){activeTab=tab;document.querySelectorAll('[data-tab]').forEach(el=>{const active=el.dataset.tab===tab;if(el.classList.contains('tab')){el.classList.toggle('border-[#0052FF]',active);el.classList.toggle('text-[#0052FF]',active);el.classList.toggle('border-transparent',!active);el.classList.toggle('text-slate-500',!active)}});document.querySelectorAll('.float-tab').forEach(el=>{const active=el.dataset.tab===tab;el.classList.toggle('bg-slate-950',active);el.classList.toggle('text-white',active);el.classList.toggle('text-slate-600',!active)});render()}

    document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>setTab(el.dataset.tab)));
    document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('backdrop').onclick=closeDrawer;
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

    document.getElementById('simulateBtn').onclick=()=>{const t=tickets.find(x=>isN1(x));if(t){t.status='Triado';t.diagnostico_tecnico='Validação MCP concluída: o sintoma é reproduzível no cliente, mas não exige alteração no núcleo da Engenharia.'}else{tickets.unshift({id:104,user_id:'USR-401',titulo:'Novo chamado em análise',descricao_cliente:'Cliente relata lentidão intermitente no portal.',prioridade:'ALTA',status:'Aberto',encaminhado_para:'N2-Engenharia',diagnostico_tecnico:'Rastro MCP em coleta: latência P95 acima de 2s no endpoint /portal/status.',cliente:'Ana Ribeiro',email:'ana@cliente.com',plano:'Pro'})}localStorage.setItem('opsTickets',JSON.stringify(tickets));render();};

    document.getElementById('resetBtn').onclick=async()=>{try{await fetch('/api/reset',{method:'POST'});}catch(e){}tickets=structuredClone(mockTickets);localStorage.setItem('opsTickets',JSON.stringify(tickets));render();};

    async function poll(){try{const r=await fetch('/api/tickets',{cache:'no-store'});if(r.ok){const data=await r.json();if(Array.isArray(data)&&data.length){tickets=data;localStorage.setItem('opsTickets',JSON.stringify(tickets));}}}catch(e){}} setInterval(poll,1500);
    render();poll();
  </script>
</body>
</html>
